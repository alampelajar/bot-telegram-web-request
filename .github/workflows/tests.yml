name: tests

on:
  push:
    branches: ["main", "feat/automatic-web-controller-mvp"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install "pytest>=8,<9" "pytest-asyncio>=0.24,<1"
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
